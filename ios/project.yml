name: StockDesk
options:
  bundleIdPrefix: com.stockdesk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  StockDesk:
    type: application
    platform: iOS
    sources:
      - path: StockDesk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stockdesk.app
        PRODUCT_NAME: StockDesk
        MARKETING_VERSION: "3.7.1"
        CURRENT_PROJECT_VERSION: "28"
        INFOPLIST_KEY_CFBundleDisplayName: StockDesk
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: "NO"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        SWIFT_EMIT_LOC_STRINGS: "NO"
    scheme:
      testTargets: []
      gatherCoverageData: false
