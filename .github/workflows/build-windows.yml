name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/requirements.txt
          pip install "numpy==1.26.4" "pandas==2.2.3"
          pip install pyinstaller==6.10.0
      - name: Build frontend
        shell: pwsh
        run: |
          cd desktop/frontend
          npm ci
          npm run build
      - name: Build exe
        shell: pwsh
        run: |
          cd desktop
          pyinstaller --noconfirm --clean --onefile --noconsole --name StockDesk `
            --add-data "frontend/dist;frontend_dist" `
            --add-data "backend/data/all_symbols.json;backend/data" `
            --collect-submodules backend `
            --collect-submodules akshare `
            --collect-data akshare `
            --collect-all webview `
            --collect-all pythonnet `
            --collect-all clr_loader `
            --hidden-import anyio._backends._asyncio `
            main.py
      - name: Smoke
        shell: pwsh
        run: |
          $env:STOCKDESK_DATA = "$pwd\testdata"
          $p = Start-Process -FilePath ".\desktop\dist\StockDesk.exe" -ArgumentList "--headless","--port","8899" -PassThru
          $ok = $false
          for ($i=0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-WebRequest "http://127.0.0.1:8899/api/health" -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok=$true; break } } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $ok) {
            Write-Host "---- stockdesk log ----"
            Get-Content "$env:LOCALAPPDATA\StockDesk\stockdesk.log" -Tail 120 -ErrorAction SilentlyContinue
            throw "exe failed health check"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: StockDesk-Windows
          path: desktop/dist/StockDesk.exe
      - name: Publish to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.10.0 desktop/dist/StockDesk.exe --clobber 
