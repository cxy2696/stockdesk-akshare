name: Model check

on:
  push:
    paths:
      - 'desktop/backend/**'
      - 'scripts/model_selftest.py'
      - '.github/workflows/model-check.yml'
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas fastapi uvicorn
      - name: Compile
        run: python -m compileall desktop/backend scripts
      - name: Model selftest
        run: python scripts/model_selftest.py
