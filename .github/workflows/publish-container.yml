name: Publish containers

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-share
            image: stockdesk-akshare-a-share
            file: desktop/Dockerfile
            version: '1.10.2'
            port: '8765'
            health: 'api/health'
          - name: us
            image: stockdesk-akshare-us
            file: us/Dockerfile
            version: '1.0.1'
            port: '8770'
            health: 'api/us/health'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
      - name: Smoke test
        run: |
          docker run -d --rm --name sd-${{ matrix.name }} -p ${{ matrix.port }}:${{ matrix.port }} ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.version }}
          ok=0
          for i in $(seq 1 30); do
            sleep 3
            if curl -fsS "http://127.0.0.1:${{ matrix.port }}/${{ matrix.health }}"; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            docker logs sd-${{ matrix.name }}
            docker stop sd-${{ matrix.name }} || true
            exit 1
          fi
          docker stop sd-${{ matrix.name }}
