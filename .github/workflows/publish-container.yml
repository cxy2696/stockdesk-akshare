name: Publish containers

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-share
            image: stockdesk-akshare-a-share
            file: desktop/Dockerfile
            version: '1.9.0'
            port: '8765'
          - name: us
            image: stockdesk-akshare-us
            file: us/Dockerfile
            version: '1.0.0'
            port: '8770'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
      - name: Smoke test
        run: |
          docker run -d --rm --name sd-${{ matrix.name }} -p ${{ matrix.port }}:${{ matrix.port }} ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.version }}
          for i in $(seq 1 20); do
            sleep 3
            if curl -fsS http://127.0.0.1:${{ matrix.port }}/api/${HEALTH_PATH:-health}; then break; fi
          done
          curl -fsS http://127.0.0.1:${{ matrix.port }}/api/health
          docker stop sd-${{ matrix.name }}
        env:
          HEALTH_PATH: ${{ matrix.name == 'us' && 'us/health' || 'health' }}
