name: Publish containers

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: a-share
            image: stockdesk-akshare-a-share
            file: desktop/Dockerfile
            version: '1.9.0'
          - name: us
            image: stockdesk-akshare-us
            file: us/Dockerfile
            version: '1.0.0'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:latest
