name: Publish US container

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: us/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/stockdesk-akshare-us:1.0.0
            ghcr.io/${{ github.repository_owner }}/stockdesk-akshare-us:latest
